<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Apple HIG 的圆角背景，更细腻的渐变 -->
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#5599FF"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- 顶部高光（Apple 风格的 specular highlight） -->
    <linearGradient id="shine" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.12)"/>
    </linearGradient>

    <!-- 底部内阴影（Apple 图标立体感） -->
    <linearGradient id="inner-shadow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="85%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.3)"/>
    </linearGradient>

    <!-- 文档卡片渐变 -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- 卡片顶部高光 -->
    <linearGradient id="card-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 主阴影 -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="128%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- 底座 — 114px 圆角符合 Apple HIG macOS 图标规范 (512×114=22.2%) -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#bg)"/>

  <!-- 高光层 -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#shine)"/>

  <!-- 底部内阴影层（立体感） -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#inner-shadow)"/>

  <!-- 文档卡片 -->
  <g filter="url(#shadow)">
    <!-- 卡片主体 — 圆角矩形 -->
    <rect x="116" y="115" width="280" height="296" rx="24" ry="24" fill="url(#card)"/>

    <!-- 卡片顶部高光带 -->
    <rect x="116" y="115" width="280" height="80" rx="24" ry="24" fill="url(#card-shine)"/>

    <!-- 折角 — 标准文档图标元素 -->
    <path d="M332 115 L396 179 L332 179 Z" fill="#E2E8F0"/>
    <path d="M332 115 L396 179 L384 179 L332 127 Z" fill="rgba(255,255,255,0.6)"/>
    <path d="M331 115 L396 180" stroke="#CBD5E1" stroke-width="1" fill="none"/>
  </g>

  <!-- 文档内容 - Markdown 排版元素 -->
  <!-- # 标题（蓝色） -->
  <rect x="156" y="162" width="28" height="14" rx="4" fill="#3B82F6"/>
  <rect x="192" y="162" width="130" height="14" rx="4" fill="#94A3B8"/>

  <!-- 分隔线 -->
  <rect x="156" y="194" width="200" height="2" rx="1" fill="#CBD5E1"/>

  <!-- 正文段落线条 -->
  <rect x="156" y="214" width="200" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="156" y="230" width="170" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="156" y="246" width="185" height="7" rx="3.5" fill="#CBD5E1"/>

  <!-- 代码块 -->
  <rect x="156" y="270" width="200" height="56" rx="8" fill="#F1F5F9"/>
  <rect x="172" y="282" width="16" height="7" rx="3.5" fill="#94A3B8"/>
  <rect x="196" y="282" width="70" height="7" rx="3.5" fill="#3B82F6"/>
  <rect x="274" y="282" width="66" height="7" rx="3.5" fill="#94A3B8"/>
  <rect x="172" y="296" width="120" height="7" rx="3.5" fill="#94A3B8"/>
  <rect x="300" y="296" width="40" height="7" rx="3.5" fill="#94A3B8"/>
  <rect x="172" y="310" width="16" height="7" rx="3.5" fill="#94A3B8"/>

  <!-- 粗体文字线 -->
  <rect x="156" y="342" width="18" height="7" rx="3.5" fill="#3B82F6"/>
  <rect x="180" y="342" width="80" height="7" rx="3.5" fill="#CBD5E1"/>
  <rect x="266" y="342" width="18" height="7" rx="3.5" fill="#3B82F6"/>

  <!-- 列表项 -->
  <circle cx="164" cy="369" r="4" fill="#3B82F6"/>
  <rect x="178" y="365" width="130" height="7" rx="3.5" fill="#CBD5E1"/>
  <circle cx="164" cy="387" r="4" fill="#3B82F6"/>
  <rect x="178" y="383" width="110" height="7" rx="3.5" fill="#CBD5E1"/>
</svg>
