# ============================================
# TMD Type-Markdown 主题示例 — 天青（亮色）
# ============================================
# 将此文件保存为 .yaml 文件，然后通过
# 主题面板的「导入 YAML 主题」按钮导入。
#
# 必填字段:
#   name       - 主题显示名称
#   group      - light 或 dark
#   variables  - CSS 变量对象
#
# 可选字段:
#   preview    - 预览色块数组（最多3个颜色）
#   description - 主题描述
# ============================================

name: 天青
group: light
preview:
  - "#f8fafc"
  - "#3b82f6"
  - "#334155"
description: 默认亮色主题，清新淡雅的天青色

variables:
  # ===== 主色调 =====
  primary-50: "#f0f4f8"
  primary-100: "#d9e2ec"
  primary-200: "#bcccdc"
  primary-300: "#9fb3c8"
  primary-400: "#829ab1"
  primary-500: "#627d98"
  primary-600: "#486581"
  primary-700: "#334e68"
  primary-800: "#243b53"
  primary-900: "#102a43"

  # ===== 强调色 =====
  accent-50: "#eff6ff"
  accent-100: "#dbeafe"
  accent-200: "#bfdbfe"
  accent-300: "#93c5fd"
  accent-400: "#60a5fa"
  accent-500: "#3b82f6"
  accent-600: "#2563eb"
  accent-700: "#1d4ed8"
  accent-800: "#1e40af"

  # ===== 语义色 =====
  success-500: "#22c55e"
  success-600: "#16a34a"
  warning-500: "#f59e0b"
  warning-600: "#d97706"
  error-500: "#ef4444"
  error-600: "#dc2626"

  # ===== 编辑器 =====
  editor-bg: "#ffffff"
  editor-surface: "#f8fafc"
  editor-text: "#1e293b"
  editor-text-secondary: "#64748b"
  editor-text-muted: "#94a3b8"
  editor-border: "#e2e8f0"
  editor-border-focus: "#3b82f6"
  editor-code-bg: "#f1f5f9"
  editor-heading: "#0f172a"
  editor-link: "#3b82f6"
  editor-accent: "#3b82f6"
  editor-quote-bg: rgba(59, 130, 246, 0.08)
  editor-selection: rgba(59, 130, 246, 0.15)

  # ===== 侧边栏 =====
  sidebar-bg: "#f8fafc"
  sidebar-surface: "#ffffff"
  sidebar-text: "#334155"
  sidebar-text-muted: "#94a3b8"
  sidebar-hover: "#f1f5f9"
  sidebar-active: "#e2e8f0"
  sidebar-border: "#e2e8f0"

  # ===== 工具栏 =====
  toolbar-bg: "#ffffff"
  toolbar-hover: "#f1f5f9"
  toolbar-active: "#e2e8f0"

  # ===== 标签栏 =====
  tab-bg: "#f8fafc"
  tab-active-bg: "#ffffff"
  tab-inactive-bg: "#f1f5f9"
  tab-hover-bg: "#e2e8f0"
  tab-border: "#e2e8f0"
  tab-active-indicator: "#3b82f6"

  # ===== 标题栏 =====
  titlebar-bg: "#f8fafc"

  # ===== 状态栏 =====
  statusbar-bg: "#f8fafc"
  statusbar-text: "#64748b"

  # ===== 阴影 =====
  shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05)
  shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)
  shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)

  # ===== 圆角 =====
  radius-sm: 4px
  radius-md: 6px
  radius-lg: 8px
  radius-xl: 12px

  # ===== 过渡 =====
  transition-fast: 150ms ease
  transition-normal: 200ms ease
  transition-slow: 300ms ease

  # ===== 行内代码 / 代码块 =====
  code-inline-bg: "#dbeafe"
  code-inline-text: "#1e40af"
  code-block-bg: "#f1f5f9"
  code-block-container-bg: transparent
  code-block-text: inherit

  # ===== 滚动条 =====
  scrollbar-track: "#f1f1f1"
  scrollbar-thumb: "#888"

  # ===== Markdown Alert =====
  alert-note-border: "#0969da"
  alert-note-bg: rgba(9, 105, 218, 0.1)
  alert-note-text: "#0969da"
  alert-tip-border: "#1a7f37"
  alert-tip-bg: rgba(26, 127, 55, 0.1)
  alert-tip-text: "#1a7f37"
  alert-important-border: "#8250df"
  alert-important-bg: rgba(130, 80, 223, 0.1)
  alert-important-text: "#8250df"
  alert-warning-border: "#9a6700"
  alert-warning-bg: rgba(154, 103, 0, 0.1)
  alert-warning-text: "#9a6700"
  alert-caution-border: "#cf222e"
  alert-caution-bg: rgba(207, 34, 46, 0.1)
  alert-caution-text: "#cf222e"
